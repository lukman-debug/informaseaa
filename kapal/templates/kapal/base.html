{% extends 'base.html' %}

{% block content %}
<div class="transition h-full ml-14 mt-14 md:ml-64">
    <div class="p-4">
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} p-4 mb-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% elif message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-700 border border-yellow-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block kapal_content %}
        {% endblock %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% endblock %}

{% block extra_css %}
<style>
    .document-status-indicator {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        font-weight: 500;
    }
    
    .status-lengkap {
        background-color: #d1fae5;
        color: #065f46;
    }
    
    .status-tidak_lengkap {
        background-color: #fee2e2;
        color: #991b1b;
    }
    
    .status-dalam_proses {
        background-color: #fef3c7;
        color: #92400e;
    }
    
    .camera-preview {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        border: 2px solid #e5e7eb;
    }
    
    .file-drop-area {
        border: 2px dashed #d1d5db;
        border-radius: 0.5rem;
        padding: 2rem;
        text-align: center;
        transition: all 0.3s ease;
    }
    
    .file-drop-area.dragover {
        border-color: #3b82f6;
        background-color: #eff6ff;
    }
    
    .document-preview {
        max-width: 200px;
        max-height: 200px;
        object-fit: cover;
        border-radius: 0.5rem;
    }
</style>
{% endblock %}
